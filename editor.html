<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>Code Studio IDE++</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/material-darker.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
<style>
  html,body{margin:0;height:100%;background:#0d1117;color:#c9d1d9;font-family:sans-serif;overflow:hidden}
  .app{display:flex;flex-direction:column;height:100%}
  header{display:flex;gap:8px;align-items:center;padding:8px;background:#161b22;border-bottom:1px solid #30363d;flex-wrap:wrap}
  header button{background:#21262d;color:#c9d1d9;border:1px solid #30363d;border-radius:4px;padding:6px 10px;cursor:pointer}
  .main{flex:1;display:flex;overflow:hidden}
  .files{width:220px;background:#161b22;border-right:1px solid #30363d;display:flex;flex-direction:column}
  .files h3{margin:0;padding:8px;font-size:14px;border-bottom:1px solid #30363d}
  .file-list{flex:1;overflow:auto}
  .file-item{display:flex;align-items:center;justify-content:space-between;padding:6px;border-bottom:1px solid #21262d}
  .file-name{flex:1;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .file-name.active{color:#58a6ff}
  .file-actions button{background:none;border:none;color:#aaa;cursor:pointer;margin-left:6px;font-size:14px}
  .badge{font-size:11px;background:#30363d;padding:2px 6px;border-radius:3px;margin-right:6px}
  .editor{flex:1;min-width:0}
  .CodeMirror{height:100%;font-size:14px}
  .side{width:40%;display:flex;flex-direction:column;min-width:240px;border-left:1px solid #30363d}
  .tabs{display:flex}
  .tabs button{flex:1;padding:8px;background:#161b22;color:#c9d1d9;border:none;border-bottom:2px solid transparent;cursor:pointer}
  .tabs button.active{border-bottom:2px solid #58a6ff;color:#58a6ff}
  .panel{flex:1;overflow:auto;display:none}
  .panel.active{display:block}
  iframe{width:100%;height:100%;border:0;background:#fff}
  .console{font-family:monospace;padding:8px;white-space:pre-wrap;background:#0d1117;color:#dbe9f8}
  #resources{width:100%;height:60px;background:#0d1117;color:#c9d1d9}
  /* Mode mobile : tout en tabs plein écran */
  @media(max-width:900px){
    .main{flex-direction:column}
    .files{display:none} /* fichiers dans un onglet mobile */
    .side{width:100%;flex:1}
    .editor{flex:1;height:auto}
    .mobile-tabs{display:flex}
  }
  .mobile-tabs{display:none;border-top:1px solid #30363d;background:#161b22}
  .mobile-tabs button{flex:1;padding:8px;background:#161b22;color:#c9d1d9;border:none;border-top:2px solid transparent;cursor:pointer}
  .mobile-tabs button.active{border-top:2px solid #58a6ff;color:#58a6ff}
</style>
</head>
<body>
<div class="app">
  <header>
    <button id="new-file"><i class="fa fa-file-circle-plus"></i> Nouveau</button>
    <button id="export"><i class="fa fa-download"></i> Exporter</button>
    <input type="file" id="import" style="display:none"/>
    <button onclick="document.getElementById('import').click()"><i class="fa fa-upload"></i> Importer</button>
    <button id="run"><i class="fa fa-play"></i> Run</button>
    <button id="clear"><i class="fa fa-broom"></i> Effacer console</button>
  </header>

  <div class="main">
    <div class="files" id="files-panel">
      <h3>Fichiers</h3>
      <div class="file-list" id="file-list"></div>
    </div>
    <div class="editor panel active" id="editor-panel"><textarea id="editor"></textarea></div>
    <div class="side panel" id="side-panel">
      <div style="padding:6px;border-bottom:1px solid #30363d">
        <label>Ressources externes :</label>
        <textarea id="resources" placeholder="https://cdn.jsdelivr.net/npm/bootstrap/dist/css/bootstrap.min.css"></textarea>
      </div>
      <div class="tabs">
        <button class="tab active" data-panel="preview">Prévisualiser</button>
        <button class="tab" data-panel="console">Console</button>
      </div>
      <div id="preview" class="panel active"><iframe id="iframe" sandbox="allow-scripts allow-same-origin"></iframe></div>
      <div id="console-panel" class="panel"><div id="console" class="console"></div></div>
    </div>
  </div>

  <!-- Onglets mobile -->
  <div class="mobile-tabs">
    <button data-panel="files-panel" class="active"><i class="fa fa-folder"></i> Fichiers</button>
    <button data-panel="editor-panel"><i class="fa fa-code"></i> Code</button>
    <button data-panel="preview"><i class="fa fa-eye"></i> Preview</button>
    <button data-panel="console-panel"><i class="fa fa-terminal"></i> Console</button>
  </div>
</div>

<!-- CodeMirror -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/xml/xml.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/javascript/javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/css/css.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/htmlmixed/htmlmixed.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/python/python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/clike/clike.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/php/php.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/ruby/ruby.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/go/go.min.js"></script>

<script>
/* ===== Editor ===== */
const editor = CodeMirror.fromTextArea(document.getElementById('editor'), {
  lineNumbers:true, theme:"material-darker", mode:"htmlmixed"
});

/* ===== Console ===== */
const consoleEl = document.getElementById('console');
function logConsole(msg,color="#dbe9f8"){
  const div=document.createElement('div');
  div.style.color=color; div.textContent=msg;
  consoleEl.appendChild(div); consoleEl.scrollTop=consoleEl.scrollHeight;
}
document.getElementById('clear').onclick=()=>consoleEl.innerHTML="";

/* ===== Files ===== */
const fileListEl=document.getElementById('file-list');
let currentFile=null;

function detectMode(name){
  const ext=name.split(".").pop().toLowerCase();
  switch(ext){
    case "html": return "htmlmixed";
    case "js": return "javascript";
    case "css": return "css";
    case "py": return "python";
    case "java": return "clike";
    case "c": case "cpp": case "cs": return "clike";
    case "php": return "php";
    case "rb": return "ruby";
    case "go": return "go";
    default: return "plaintext";
  }
}
function badgeFor(name){ return name.split(".").pop().toUpperCase(); }

function refreshFiles(){
  fileListEl.innerHTML="";
  const files=JSON.parse(localStorage.getItem("files")||"{}");
  Object.keys(files).forEach(name=>{
    const row=document.createElement("div"); row.className="file-item";
    const left=document.createElement("div");
    left.className="file-name"+(name===currentFile?" active":"");
    left.innerHTML=`<span class="badge">${badgeFor(name)}</span>${name}`;
    left.onclick=()=>openFile(name);
    const actions=document.createElement("div"); actions.className="file-actions";
    const rename=document.createElement("button"); rename.innerHTML='<i class="fa fa-pen"></i>';
    rename.onclick=(e)=>{e.stopPropagation();renameFile(name)};
    const del=document.createElement("button"); del.innerHTML='<i class="fa fa-trash"></i>';
    del.onclick=(e)=>{e.stopPropagation();deleteFile(name)};
    actions.append(rename,del); row.append(left,actions);
    fileListEl.appendChild(row);
  });
}
function saveCurrent(){
  if(!currentFile) return;
  const files=JSON.parse(localStorage.getItem("files")||"{}");
  files[currentFile]=editor.getValue();
  localStorage.setItem("files",JSON.stringify(files));
}
function openFile(name){
  const files=JSON.parse(localStorage.getItem("files")||"{}");
  currentFile=name;
  editor.setValue(files[name]||"");
  editor.setOption("mode", detectMode(name));
  refreshFiles();
}
function renameFile(oldName){
  const newName=prompt("Nouveau nom ?",oldName);
  if(!newName) return;
  const files=JSON.parse(localStorage.getItem("files")||"{}");
  if(files[newName]){alert("Nom déjà existant");return;}
  files[newName]=files[oldName]; delete files[oldName];
  localStorage.setItem("files",JSON.stringify(files));
  currentFile=newName; refreshFiles();
}
function deleteFile(name){
  if(!confirm("Supprimer "+name+" ?")) return;
  const files=JSON.parse(localStorage.getItem("files")||"{}");
  delete files[name]; localStorage.setItem("files",JSON.stringify(files));
  if(currentFile===name) currentFile=null;
  refreshFiles(); editor.setValue("");
}
document.getElementById("new-file").onclick=()=>{
  const name=prompt("Nom du fichier ?"); if(!name) return;
  const files=JSON.parse(localStorage.getItem("files")||"{}"); files[name]="";
  localStorage.setItem("files",JSON.stringify(files));
  currentFile=name; refreshFiles(); editor.setValue(""); editor.setOption("mode", detectMode(name));
};
editor.on("change",saveCurrent); refreshFiles();

/* Export/Import */
document.getElementById("export").onclick=()=>{
  if(!currentFile){alert("Pas de fichier ouvert.");return;}
  const blob=new Blob([editor.getValue()],{type:"text/plain"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download=currentFile; a.click();
};
document.getElementById("import").onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    const files=JSON.parse(localStorage.getItem("files")||"{}");
    files[f.name]=r.result; localStorage.setItem("files",JSON.stringify(files));
    currentFile=f.name; refreshFiles(); editor.setValue(r.result); editor.setOption("mode", detectMode(f.name));
  };
  r.readAsText(f);
};

/* ===== Tabs desktop ===== */
document.querySelectorAll('.tab').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.side .panel').forEach(p=>p.classList.remove('active'));
    btn.classList.add('active'); document.getElementById(btn.dataset.panel).classList.add('active');
  });
});

/* ===== Tabs mobile ===== */
document.querySelectorAll('.mobile-tabs button').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.mobile-tabs button').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
    btn.classList.add('active'); document.getElementById(btn.dataset.panel).classList.add('active');
  });
});

/* ===== Runner ===== */
document.getElementById('run').onclick=()=>{
  if(!currentFile){alert("Aucun fichier ouvert.");return;}
  const mode=detectMode(currentFile);
  const code=editor.getValue();
  logConsole("▶ Run: "+currentFile,"#58a6ff");
  if(mode==="htmlmixed"||mode==="css"||mode==="javascript"){ runHTML(code,mode); }
  else if(mode==="python"){ runPython(code); }
  else logConsole("Exécution non supportée pour "+mode,"#f88");
};
function runHTML(code,mode){
  let html="";
  if(mode==="css") html=`<style>${code}</style>`;
  else if(mode==="javascript") html=`<script>${code}<\/script>`;
  else html=code;
  const resources=document.getElementById("resources").value.trim().split("\n").filter(x=>x);
  const links=resources.map(url=>url.endsWith(".css")?`<link rel="stylesheet" href="${url}">`:`<script src="${url}"><\/script>`).join("\n");
  document.getElementById('iframe').srcdoc=`<!doctype html><html><head><meta charset="utf-8">${links}</head><body>${html}
   <script>console.log=(...a)=>parent.postMessage({t:"log",m:a.join(" ")}, "*");console.error=(...a)=>parent.postMessage({t:"err",m:a.join(" ")}, "*");window.onerror=(m)=>parent.postMessage({t:"err",m}, "*");<\/script></body></html>`;
}

/* Python via Pyodide */
let pyodide=null;
async function runPython(code){
  if(!pyodide){
    logConsole("Chargement Pyodide...","#ff0");
    const s=document.createElement("script"); s.src="https://cdn.jsdelivr.net/pyodide/v0.23.4/full/pyodide.js";
    document.head.appendChild(s); await new Promise(r=>s.onload=r);
    pyodide=await loadPyodide({indexURL:"https://cdn.jsdelivr.net/pyodide/v0.23.4/full/"});
  }
  try{ let out=await pyodide.runPythonAsync(code); if(out!==undefined) logConsole(String(out)); }
  catch(e){ logConsole(String(e),"#f88"); }
}

/* Console listener */
window.addEventListener("message",e=>{
  if(e.data.t==="log") logConsole(e.data.m,"#8f8");
  if(e.data.t==="err") logConsole(e.data.m,"#f88");
});
</script>
</body>
</html>
